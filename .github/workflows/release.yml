name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.5, or v0.2.0-beta.1 for a beta)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-beta\.\d+)?$') {
            throw "Expected a release tag like v0.1.5 or v0.2.0-beta.1, got $env:RELEASE_TAG"
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      # The version comes from the tag, so a beta (v0.7.0-beta.2) needs no version commit on its
      # branch. A beta's semver sorts below the release of the same number, so beta installs move
      # on to that release when it comes out.
      - name: Stamp the version from the tag
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          foreach ($path in 'package.json', 'apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json') {
            $text = Get-Content -LiteralPath $path -Raw
            $text = [regex]::new('"version":\s*"[^"]*"').Replace($text, "`"version`": `"$version`"", 1)
            [IO.File]::WriteAllText((Resolve-Path $path), $text)
          }
          $meta = 'apps/desktop/src/appMeta.ts'
          $text = (Get-Content -LiteralPath $meta -Raw) -replace "APP_VERSION = '[^']*'", "APP_VERSION = '$version'"
          [IO.File]::WriteAllText((Resolve-Path $meta), $text)

      - name: Bake osu! client credentials into the sidecar
        shell: pwsh
        env:
          OSU_CLIENT_ID: ${{ vars.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ vars.OSU_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OSU_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:OSU_CLIENT_SECRET)) {
            throw 'OSU_CLIENT_ID / OSU_CLIENT_SECRET repository variables are not set (Settings > Secrets and variables > Actions > Variables).'
          }
          $path = 'engine/ReplayEditor.Api/Sessions/OsuClientSecrets.cs'
          (Get-Content -LiteralPath $path -Raw) `
            -replace 'ClientId = "[^"]*"', "ClientId = `"$env:OSU_CLIENT_ID`"" `
            -replace 'ClientSecret = "[^"]*"', "ClientSecret = `"$env:OSU_CLIENT_SECRET`"" |
            Set-Content -LiteralPath $path -Encoding utf8

      - name: Publish sidecar
        run: pwsh scripts/prepare-sidecar.ps1 -Configuration Release

      # tauri-action creates a missing release with a target commit, which the workflow token is
      # refused when the tagged commit changes a workflow file. Creating the draft for the
      # existing tag first avoids that; tauri-action then finds it and only uploads.
      - name: Create draft release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:RELEASE_TAG --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title $env:RELEASE_TAG --notes "" --repo ${{ github.repository }}
            if ($LASTEXITCODE -ne 0) { throw "Could not create the draft release for $env:RELEASE_TAG" }
          }
          $global:LASTEXITCODE = 0

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '${{ env.RELEASE_TAG }}'
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta.') }}

      - name: Build portable ZIP
        id: portable
        shell: pwsh
        run: |
          $targetDir = 'apps/desktop/src-tauri/target/release'
          $app = Join-Path $targetDir 'osu-replay-editor.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw "Portable app executable not found at $app" }

          $sidecar = 'apps/desktop/src-tauri/binaries/replay-editor-sidecar-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path -LiteralPath $sidecar)) { throw "Portable sidecar executable not found at $sidecar" }

          $tag = $env:RELEASE_TAG
          $portableName = "osu-replay-editor-$tag-windows-x64-portable"
          $portableDir = Join-Path $env:RUNNER_TEMP $portableName
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $app -Destination $portableDir
          Copy-Item -LiteralPath $sidecar -Destination $portableDir
          @'
          osu! Replay Editor portable for Windows x64

          Run osu-replay-editor.exe. Keep the sidecar executable in the same directory.
          Microsoft Edge WebView2 Runtime is required.
          '@ | Set-Content -LiteralPath (Join-Path $portableDir 'README.txt') -Encoding utf8

          $zip = Join-Path $env:RUNNER_TEMP "$portableName.zip"
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $zip -CompressionLevel Optimal
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('osu-replay-editor.exe', 'replay-editor-sidecar-x86_64-pc-windows-msvc.exe', 'README.txt')) {
              if ($required -notin $entries) { throw "Portable ZIP is missing $required" }
            }
          } finally {
            $archive.Dispose()
          }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach portable ZIP to Actions run
        uses: actions/upload-artifact@v4
        with:
          name: osu-replay-editor-windows-x64-portable
          path: ${{ steps.portable.outputs.zip }}
          if-no-files-found: error

      - name: Attach portable ZIP to draft release
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG $env:PORTABLE_ZIP --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTABLE_ZIP: ${{ steps.portable.outputs.zip }}

      # The optional pp calculator: osu!'s own difficulty and performance code in a separate
      # program, downloaded by the app only when the user turns pp on. The app checks the file
      # against the published SHA-256 before using it.
      - name: Build and attach the pp calculator
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'pp-calculator'
          dotnet publish engine/ReplayEditor.PerformanceCalculator/ReplayEditor.PerformanceCalculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o $out
          if ($LASTEXITCODE -ne 0) { throw 'pp calculator publish failed' }
          $asset = Join-Path $env:RUNNER_TEMP 'pp-calculator-win-x64.exe'
          Copy-Item -LiteralPath (Join-Path $out 'pp-calculator.exe') -Destination $asset
          & $asset --version
          if ($LASTEXITCODE -ne 0) { throw 'pp calculator does not start' }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$asset.sha256" -Value "$hash  pp-calculator-win-x64.exe" -Encoding ascii -NoNewline
          gh release upload $env:RELEASE_TAG $asset "$asset.sha256" --clobber --repo ${{ github.repository }}

      - name: Build and upload latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -Path $bundleDir -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in $bundleDir" }
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "No signature file found at $sigPath" }
          $signature = Get-Content -LiteralPath $sigPath -Raw
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          # GitHub renames uploaded assets (spaces become dots, "!" is dropped), so take the name of
          # the installer asset that actually exists instead of rebuilding it from the local name.
          $assets = gh release view $tag --repo ${{ github.repository }} --json assets | ConvertFrom-Json
          $asset = $assets.assets | Where-Object { $_.name -like '*_x64-setup.exe' } | Select-Object -First 1
          if (-not $asset) { throw "No *_x64-setup.exe asset found on release $tag" }
          # The release is still a draft here, and a draft's own asset URL points at a temporary
          # "untagged-…" path that stops working once it is published. Build the URL the asset
          # will have after publishing instead.
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($asset.name))"
          $manifest = @{
            version = $version
            notes = "See the release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{ signature = $signature.Trim(); url = $downloadUrl }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          gh release upload $tag latest.json --clobber --repo ${{ github.repository }}
