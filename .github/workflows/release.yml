name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      # Env vars at this point only exist for this CI job — they never reach the installed app on
      # an end user's machine. Bake the real client id/secret into the compiled sidecar instead,
      # so a released build works without the user setting anything up.
      - name: Bake osu! client credentials into the sidecar
        shell: pwsh
        env:
          OSU_CLIENT_ID: ${{ vars.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ vars.OSU_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OSU_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:OSU_CLIENT_SECRET)) {
            throw 'OSU_CLIENT_ID / OSU_CLIENT_SECRET repository variables are not set (Settings > Secrets and variables > Actions > Variables).'
          }
          $path = 'engine/ReplayEditor.Api/Sessions/OsuClientSecrets.cs'
          (Get-Content -LiteralPath $path -Raw) `
            -replace 'ClientId = "[^"]*"', "ClientId = `"$env:OSU_CLIENT_ID`"" `
            -replace 'ClientSecret = "[^"]*"', "ClientSecret = `"$env:OSU_CLIENT_SECRET`"" |
            Set-Content -LiteralPath $path -Encoding utf8

      - name: Publish sidecar
        run: pwsh scripts/prepare-sidecar.ps1 -Configuration Release

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'osu! Replay Editor ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

      - name: Build and upload portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $targetDir = 'apps/desktop/src-tauri/target/release'
          $app = Join-Path $targetDir 'osu-replay-editor.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw "Portable app executable not found at $app" }

          $sidecar = Get-ChildItem -Path $targetDir -Filter 'replay-editor-sidecar*.exe' | Select-Object -First 1
          if (-not $sidecar) {
            $sidecar = Get-ChildItem -Path 'apps/desktop/src-tauri/binaries' -Filter 'replay-editor-sidecar*.exe' | Select-Object -First 1
          }
          if (-not $sidecar) { throw 'Portable sidecar executable was not produced.' }

          $tag = '${{ github.ref_name }}'
          $portableName = "osu-replay-editor-$tag-windows-x64-portable"
          $portableDir = Join-Path $env:RUNNER_TEMP $portableName
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $app -Destination $portableDir
          Copy-Item -LiteralPath $sidecar.FullName -Destination $portableDir
          @'
          osu! Replay Editor portable for Windows x64

          Run osu-replay-editor.exe. Keep the sidecar executable in the same directory.
          Microsoft Edge WebView2 Runtime is required.
          '@ | Set-Content -LiteralPath (Join-Path $portableDir 'README.txt') -Encoding utf8

          $zip = Join-Path $env:RUNNER_TEMP "$portableName.zip"
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $zip -CompressionLevel Optimal
          gh release upload $tag $zip --clobber --repo ${{ github.repository }}

      # tauri-action's built-in includeUpdaterJson doesn't reliably emit latest.json for the
      # NSIS target (it looks for a *.nsis.zip.sig, but Tauri 2 signs the setup.exe directly) —
      # build and upload it ourselves from the artifacts that actually exist.
      - name: Build and upload latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -Path $bundleDir -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in $bundleDir" }
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "No signature file found at $sigPath" }
          $signature = Get-Content -LiteralPath $sigPath -Raw
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$([Uri]::EscapeDataString($installer.Name))"
          $manifest = @{
            version = $version
            notes = "See the release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{ signature = $signature.Trim(); url = $downloadUrl }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          gh release upload $tag latest.json --clobber --repo ${{ github.repository }}
