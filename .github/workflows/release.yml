name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Write app.config.json
        shell: pwsh
        env:
          OSU_CLIENT_ID: ${{ vars.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ vars.OSU_CLIENT_SECRET }}
        run: |
          @{ osu = @{ clientId = $env:OSU_CLIENT_ID; clientSecret = $env:OSU_CLIENT_SECRET } } |
            ConvertTo-Json | Set-Content -Path app.config.json -Encoding utf8

      - name: Publish sidecar
        run: pwsh scripts/prepare-sidecar.ps1 -Configuration Release

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OSU_CLIENT_ID: ${{ vars.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ vars.OSU_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "osu! Replay Editor ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # tauri-action's built-in includeUpdaterJson doesn't reliably emit latest.json for the
      # NSIS target (it looks for a *.nsis.zip.sig, but Tauri 2 signs the setup.exe directly) —
      # build and upload it ourselves from the artifacts that actually exist.
      - name: Build and upload latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -Path $bundleDir -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in $bundleDir" }
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "No signature file found at $sigPath" }
          $signature = Get-Content -LiteralPath $sigPath -Raw
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$([Uri]::EscapeDataString($installer.Name))"
          $manifest = @{
            version = $version
            notes = "See the release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{ signature = $signature.Trim(); url = $downloadUrl }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          gh release upload $tag latest.json --clobber --repo ${{ github.repository }}
